[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atlas-pools-server"
version = "0.1.0"
description = "Specification-first scaffold for a secure Google-authenticated pools server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1",
  "authlib>=1.3,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "selenium>=4.25,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "contract: public API contract tests",
  "security: security and tenant-isolation tests",
  "database: persistence behavior observed through the public API",
  "selenium: focused browser tests requiring a local approved target",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["atlas"]

[tool.coverage.report]
fail_under = 85
