<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Atlas private pool groups">
    <!-- Keep this policy in the document as a frontend-safe fallback. The deployed
         response must also send the equivalent HTTP header (see verification notes). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self'; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
    <title>Atlas Pools</title>
    <link rel="stylesheet" href="./styles.css?v=8">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#/groups">Atlas Pools</a>
      <div id="session-controls" aria-live="polite"></div>
    </header>
    <main id="app" tabindex="-1"></main>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <!-- Bump the asset URL when the frontend changes so an already-open browser
         cannot keep rendering an older member picker from its HTTP cache. -->
    <script type="module" src="./app.js?v=8"></script>
  </body>
</html>
